services:
  postgres:
    image: postgres:16-alpine
    container_name: rotaagil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entregadores
    ports:
      - "5433:5432"
    volumes:
      - rotaagil_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entregadores"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rotaagil_postgres:
